# Nginx configuration for Theorem Marketplace
#
# This file should be placed in /etc/nginx/sites-available/ and symlinked
# to /etc/nginx/sites-enabled/
#
# Installation:
#   sudo cp theorem-marketplace.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/theorem-marketplace.conf /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# For SSL, use Certbot:
#   sudo certbot --nginx -d theorem-marketplace.com -d www.theorem-marketplace.com

server {
    listen 80;
    listen [::]:80;
    server_name theorem-marketplace.com www.theorem-marketplace.com;

    # Redirect HTTP to HTTPS (uncomment after SSL is configured)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Lean syntax checks import Mathlib (~20s) and can wait on the verifier's hourly update.
        proxy_read_timeout 300s;

        # WebSocket support (if needed in the future)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

