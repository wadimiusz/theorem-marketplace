[Log]
Level = 'warn'

[WebServer]
AllowOrigins = '*'
SecureCookies = false

[WebServer.TLS]
HTTPSPort = 0

[[EVM]]
ChainID = '11155111'
FinalityDepth = 10

[EVM.GasEstimator]
Mode = 'FixedPrice'

[EVM.HeadTracker]
HistoryDepth = 15

[EVM.NodePool]
PollInterval = '60s'

# Primary: Infura (reliable WSS, free tier with FixedPrice gas should stay within limits)
[[EVM.Nodes]]
Name = 'Infura'
WSURL = 'wss://sepolia.infura.io/ws/v3/YOUR_INFURA_PROJECT_ID'
HTTPURL = 'https://sepolia.infura.io/v3/YOUR_INFURA_PROJECT_ID'

# SendOnly fallbacks for transaction broadcasting
[[EVM.Nodes]]
Name = 'DRPC'
HTTPURL = 'https://sepolia.drpc.org'
SendOnly = true

[[EVM.Nodes]]
Name = 'PublicNode'
HTTPURL = 'https://ethereum-sepolia-rpc.publicnode.com'
SendOnly = true

[JobPipeline]
MaxRunDuration = '60m'

[JobPipeline.HTTPRequest]
DefaultTimeout = '600s'
