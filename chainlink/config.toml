[Log]
Level = 'warn'

[WebServer]
AllowOrigins = '*'
SecureCookies = false

[WebServer.TLS]
HTTPSPort = 0

[[EVM]]
ChainID = '11155111'
FinalityDepth = 10
# Sepolia defaults this to true, which silently ignores FinalityDepth and makes the node
# fetch the 'finalized' block ~3x per head plus every 5s — half of all RPC credits.
FinalityTagEnabled = false

[EVM.GasEstimator]
Mode = 'FixedPrice'

# Fetches the node key's balance on every head (~7k eth_getBalance/day); only feeds the UI.
[EVM.BalanceMonitor]
Enabled = false

[EVM.HeadTracker]
HistoryDepth = 15

[EVM.NodePool]
PollInterval = '5m'

# Primary: Infura (reliable WSS, free tier with FixedPrice gas should stay within limits)
[[EVM.Nodes]]
Name = 'Infura'
WSURL = 'wss://sepolia.infura.io/ws/v3/YOUR_INFURA_PROJECT_ID'
HTTPURL = 'https://sepolia.infura.io/v3/YOUR_INFURA_PROJECT_ID'

# SendOnly fallbacks for transaction broadcasting
[[EVM.Nodes]]
Name = 'DRPC'
HTTPURL = 'https://sepolia.drpc.org'
SendOnly = true

[[EVM.Nodes]]
Name = 'PublicNode'
HTTPURL = 'https://ethereum-sepolia-rpc.publicnode.com'
SendOnly = true

[JobPipeline]
MaxRunDuration = '60m'

[JobPipeline.HTTPRequest]
DefaultTimeout = '600s'
